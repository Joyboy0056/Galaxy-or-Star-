# PyTorch Astronomy Classifier Configuration

data:
  data_dir: "data/dataset"  # Contains star/ and galaxy/ folders
  train_split: 0.7
  val_split: 0.15
  # test_split: 0.15 (calculated automatically)

model:
  num_classes: 2
  pretrained: true
  backbone: "resnet18"  # Currently fixed, could be configurable

training:
  batch_size: 32
  num_epochs: 25
  learning_rate: 0.001
  
optimizer:
  type: "adam"
  weight_decay: 0.0001
  
scheduler:
  type: "step"
  step_size: 7
  gamma: 0.1

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation: 45
  color_jitter:
    brightness: 0.2
    contrast: 0.2